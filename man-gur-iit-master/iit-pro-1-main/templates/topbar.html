<!-- TOPBAR -->
<div class="topbar">
  <div class="tb-brand-row">
    <div class="tb-brand-left">
      <button id="tb-sidebar-toggle" class="tb-icon-btn tb-menu-btn" onclick="toggleSidebar()" title="Toggle sidebar">
        <i data-lucide="menu"></i>
      </button>

      <div class="tb-logo-container" onclick="clearActiveProject(); showView('dashboard', null);">
        <div class="tb-gov-circle-logo">
          <i data-lucide="landmark"></i>
        </div>
        <div class="tb-gov-texts">
          <span>Government of Punjab - EMGSM 2020 - IIT Ropar Research Cell</span>
          <strong>District Survey Report Automation Portal</strong>
          <em>DSR Automation Portal - IIT Ropar - Punjab</em>
        </div>
      </div>
    </div>

    <div class="tb-actions-container">
      <div class="tb-nav-dropdown">
        <button type="button" class="tb-icon-btn" onclick="toggleNotificationDropdown()" title="Notifications">
          <i data-lucide="bell"></i>
          <span id="tb-notif-dot"></span>
        </button>
        <div class="tb-dropdown-menu" id="tb-notif-dropdown">
          <div class="tb-dropdown-title">Notifications</div>
          <div id="tb-notif-list" class="tb-empty-note">No new notifications</div>
        </div>
      </div>

      <button type="button" class="tb-icon-btn tb-theme-toggle" onclick="toggleDarkMode()" title="Toggle dark mode" aria-label="Toggle dark mode" data-theme-toggle>
        <i data-lucide="moon"></i>
      </button>

      <button type="button" class="tb-action-pill" onclick="showView('esign', null)">
        <i data-lucide="pen-tool"></i>
        <span>E-Sign</span>
      </button>

      <button type="button" class="tb-action-pill" onclick="showView('generate', null)">
        <i data-lucide="file-text"></i>
        <span>PDF</span>
      </button>

      <button id="tb-btn-new-project" type="button" class="tb-action-pill tb-action-primary" onclick="newProjectModal()">
        <i data-lucide="plus"></i>
        <span>New Project</span>
      </button>
    </div>
  </div>

  <div class="tb-sub-row">
    <nav class="tb-nav">
      <button type="button" class="tb-sub-nav-btn active" onclick="clearActiveProject(); showView('dashboard', this)">
        <i data-lucide="layout-dashboard"></i>
        <span>Dashboard</span>
      </button>

      <div class="tb-nav-dropdown">
        <button type="button" class="tb-sub-nav-btn" onclick="showView('projects', this)">
          <i data-lucide="folder"></i>
          <span>Projects</span>
          <i data-lucide="chevron-down"></i>
        </button>
        <div class="tb-dropdown-menu" id="tb-projects-dropdown">
          <a href="#" onclick="showView('projects', null); return false;">View All Projects</a>
          <a href="#" onclick="newProjectModal(); return false;">Add New Project</a>
        </div>
      </div>

      <button type="button" class="tb-sub-nav-btn" onclick="showView('workflow', this)">
        <i data-lucide="git-pull-request"></i>
        <span>Report Workflow</span>
      </button>

      <button id="tb-nav-audit-logs" type="button" class="tb-sub-nav-btn" style="display:none" onclick="showView('audit-logs', this)">
        <i data-lucide="clipboard-list"></i>
        <span>Audit Logs</span>
      </button>
    </nav>

    <div class="tb-status-actions">
      <span class="tb-district" id="tb-district-badge">Punjab</span>
    </div>
  </div>
</div>
